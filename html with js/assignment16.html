<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch and display bascon ipsum data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="2xl:container mx-auto bg-green-300">
        <div class="w-[90%] mx-auto p-10">

    <p class="text-balance text-black text-base leading-6 font-medium font-Roboto  " id="par">u</p>
    <div class="flex flex-row justify-center items-center">
    <button class= "bg-orange-500 text-white px-6 py-1" id="refresh"> refresh </button>
</div>
    </div>
    </div>
   
    <script>
     var par =document.getElementById("par");
     var refresh =document.getElementById("refresh");
    function fetchdata(){

     fetch('https://baconipsum.com/api/?type=all.')
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`); // Check for non-2xx status codes
    }
    return response.json(); // Parse the response as JSON
  })
  .then(data => {
    console.log(data); // Handle the data
    par.textContent=`${data}`;
  })
  .catch(error => {
    console.log("error occured"); // Handle any errors
  });
}

  refresh.addEventListener("click",fetchdata);
 fetchdata();
 </script>
 
    
</body>
</html>
