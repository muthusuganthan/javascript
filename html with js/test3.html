<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex flex-col items-center gap-5">
         <h1 id="count">0</h1>
         <button id="btnstart" class="bg-slate-700 text-black px-4 py-2">start</button>
         <button id="btnstop" class="bg-slate-700 text-black px-4 py-2">stop</button>
         <button id="out" class="bg-slate-700 text-black px-4 py-2">timeout</button>
    </div>
    <script>
var count=document.getElementById("count");
var btnstart=document.getElementById("btnstart");
var btnstop=document.getElementById("btnstop");
var out=document.getElementById("out");
var arun;

btnstart.addEventListener("click",()=>{
       arun=  setInterval(()=>{
            count.textContent = parseInt(count.textContent) + 1; 
        },1000)
    })


btnstop.addEventListener("click",()=>{
    clearInterval(arun)

})
btnstart.addEventListener("click",()=>{
    setTimeout(()=>{
        alert("over time")
        clearInterval(arun)
    },5000)
})


    </script>
    
</body>
</html>
